services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio
      CLIENT_HASH_SECRET: ${CLIENT_HASH_SECRET:?set CLIENT_HASH_SECRET}

  web:
    ports: !reset []
    networks:
      - default
      - edge

networks:
  edge:
    name: ${EDGE_NETWORK:?set EDGE_NETWORK}
    external: true
