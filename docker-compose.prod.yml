x-site-origin: &site-origin https://najafov.dev

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio
      CLIENT_HASH_SECRET: ${CLIENT_HASH_SECRET:?set CLIENT_HASH_SECRET}
      GEO_DIR: /app/geo
      SITE_ORIGIN: *site-origin
      CV_RENDER_TOKEN: ${CV_RENDER_TOKEN:?set CV_RENDER_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./geo:/app/geo:ro

  web:
    environment:
      CV_RENDER_TOKEN: ${CV_RENDER_TOKEN:?set CV_RENDER_TOKEN}
      SITE_ORIGIN: *site-origin
    ports: !reset []
    networks:
      - default
      - edge

  backup:
    build: ./deploy/backup
    container_name: portfolio-backup
    profiles: ['app']
    user: '${BACKUP_UID:?set BACKUP_UID}:${BACKUP_GID:?set BACKUP_GID}'
    environment:
      PGHOST: postgres
      PGUSER: portfolio
      PGDATABASE: portfolio
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    name: ${EDGE_NETWORK:?set EDGE_NETWORK}
    external: true
