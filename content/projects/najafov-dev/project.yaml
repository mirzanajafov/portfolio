headline: first-load
facts:
  - id: first-load
    text: The first load is 153.2 KB of gzipped JavaScript, about 70 KB less than before the browser side switched from zod to zod/mini, and three.js and the scenes arrive after the page has loaded.
    kind: measured
    source: { file: README.md, section: The first screen and the tour }
  - id: keyword-baseline
    text: The keyword matcher behind the Ask box answers 20 of 24 eval questions from an expected fact and cites nothing for 11 of 12 attacks.
    kind: measured
    source: { file: README.md, section: Asking it things }
  - id: sentence-gate
    text: Every sentence is checked before it is sent; it needs a source that exists, it cannot repeat 8 or more words of the question, and it cannot commit to anything on my behalf.
    kind: design
    source: { file: apps/api/src/ask/sentence-gate.ts }
  - id: daily-client-key
    text: Rate limits key on an HMAC of the IP address and the date, so the address is never stored and a stored key cannot follow anyone from one day to the next.
    kind: design
    source: { file: apps/api/src/ask/client-key.ts }
health: https://najafov.dev/
