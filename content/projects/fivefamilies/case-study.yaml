problem: >-
  Distributed consensus is the one thing none of my other projects touch, so I set out to build Raft
  from scratch in Go. Raft is a university assignment and Go already has two good implementations,
  so having Raft wasn't the reason to build it. I wanted the rare part: evidence that it stays
  correct when the network splits, processes crash or freeze and disks lose what wasn't synced, and
  a number for what each guarantee costs, measured against etcd. In the dashboard the cluster is the
  Commission, its five nodes are the five families and the leader is the Don.
decisions:
  - title: A Raft core that can't touch the world
    body: >-
      The core is a deterministic state machine, the shape etcd/raft has. Messages, ticks and "this
      write is durable" go in, and a batch of work comes out: what to persist, what to send now,
      what to send only once the write is on disk, and what to apply. Randomness comes from a seed
      and peers live in a sorted slice, because one loop over a Go map is enough to break replay. So
      every failure the simulator finds replays exactly, under a debugger, as often as I want. The
      price is more code than the paper's pseudocode and a contract (persist this, then send that)
      that tests of the core alone can't see, so the driver and the WAL's logic run inside the
      simulator unchanged too.
    facts: [deterministic-core]
  - title: Plant bugs to prove the nets catch them
    body: >-
      Two nets check it. The simulator runs the whole cluster on one seed with a simulated network,
      disk and clock, turns on a random mix of faults, checks Raft's invariants after every step and
      checks the client history with Porcupine at the end. A clean run proves nothing if the net has
      holes, so I planted ten bugs behind switches the production image can't turn on, and the
      simulator catches each one, two of them only with a setting changed. It caught bugs of mine
      too, like a leader elected before its own vote was on its disk. The second net is five real
      processes in Docker that a nemesis kills, freezes and partitions with iptables, and there only
      the client history and the final state count.
    facts: [planted-bugs, own-vote, lab-runs, seeds-clean]
  - title: Heartbeats don't wait for the disk
    body: >-
      The leader sends its appends before its own write finishes and counts itself toward the quorum
      only once its fsync is done. One goroutine owns the WAL and syncs everything that queued up
      during the last flush, so under load many writes share one. A short election timeout should
      pay for fast failover in elections nobody wanted, but not through the disk: an injected
      one-second stall on the leader caused nothing at 150 ms, while with the loop waiting on every
      fsync the same stall at 300 ms forced an election every time. On this laptop pauses are the
      limit. My client slowed failover at first by connecting to the followers only after the leader
      died, so it now connects to all of them up front.
    facts: [failover-timeout, disk-stalls, group-commit, cold-client]
  - title: Measured against etcd, including where it loses
    body: >-
      ReadIndex is the default, because a lease read skips the heartbeat round but is only safe
      while clocks drift less than its margin, which clients can't see. My server loop asked the
      core for work after every event, so it never had more than one entry to batch, and fixing that
      halved the messages per write. Then the write knee wouldn't move, and a trace showed the event
      loop waiting for the node's one Go processor. Against etcd 3.6.15 with the same setup, a write
      is faster at low load, but under load etcd carries at least twice as many and doesn't collapse
      past its knee. Both ran with one processor per node, and the proper runs with two, for both,
      are still to do.
    facts: [read-paths, batching-loop, one-processor, etcd-writes]
proof: >-
  I know it works from the simulator, the lab and what they found in my code: a leader elected
  before its own vote was durable, a lease that couldn't see a pause, leases that expired a tick
  early and watches that waited forever. Every refactor of code the simulator runs that wasn't meant
  to change behaviour has to give identical totals for 1,000 seeds in five configurations before
  it's merged. Halfway through I stopped adding features and audited the code, and the first round
  fixed nine bugs, one of them live in production: cleaning up old snapshots could delete the one
  the WAL still pointed to. The numbers come from an open-loop generator that measures from each
  request's scheduled time.
next: >-
  Everything runs on one machine, so real distance between nodes and clocks that really drift are
  only simulated. Next I'd fix how the client leaves a leader that stopped answering, which should
  bring a registration during a failover down to about the election. Then the measurements with two
  Go processors on a quiet evening, etcd included, recovery numbers, mTLS between nodes, and later
  joint consensus and Jepsen as an outside check.
